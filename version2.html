<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASii — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    :root {
      --violet:    #3C183C;
      --periwinkle:#D2CBFE;
      --lace:      #FFF8EB;
      --lime:      #CDFC8A;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }
    @keyframes breathe {
      0%,100% { opacity: 0.04; }
      50%      { opacity: 0.10; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body {
      background: var(--violet);
      position: relative;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }
    .watermark span {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(280px, 40vw, 520px);
      font-weight: 300;
      color: #ffffff;
      letter-spacing: -0.04em;
      line-height: 1;
      animation: breathe 5s ease-in-out infinite;
    }

    .inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 48px 24px;
      width: 100%;
      max-width: 560px;
      animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) both;
    }

    .logo-wrap {
      width: clamp(140px, 22vw, 200px);
      margin-bottom: 56px;
      opacity: 0.9;
    }
    .logo-wrap img { width: 100%; height: auto; display: block; }

    h1 {
      font-size: clamp(34px, 6vw, 56px);
      font-weight: 300;
      font-style: italic;
      color: var(--lace);
      letter-spacing: 0.01em;
      line-height: 1.15;
      margin-bottom: 16px;
    }
    p.sub {
      font-size: clamp(14px, 2vw, 17px);
      font-weight: 300;
      color: var(--periwinkle);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 48px;
      opacity: 0.8;
    }

    .form-wrap { width: 100%; max-width: 400px; }
    .form-group { margin-bottom: 16px; }
    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(210,203,254,0.35);
      color: var(--lace);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      font-weight: 300;
      padding: 12px 0;
      outline: none;
      transition: border-color 0.25s;
      letter-spacing: 0.03em;
    }
    input::placeholder { color: rgba(210,203,254,0.4); }
    input:focus { border-bottom-color: var(--lime); }

    .cta-btn {
      margin-top: 32px;
      width: 100%;
      background: var(--lime);
      color: var(--violet);
      border: none;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 18px 32px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .cta-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .cta-btn:active { transform: translateY(0); }
    .cta-btn:disabled { opacity: 0.5; cursor: default; }

    .disclaimer {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(210,203,254,0.35);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .error-msg {
      margin-top: 14px;
      font-size: 13px;
      color: rgba(255,120,120,0.85);
      letter-spacing: 0.04em;
      display: none;
    }
    .error-msg.show { display: block; }

    .success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .success.show { display: flex; }
    .success p {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 300;
      font-style: italic;
      color: var(--lime);
      letter-spacing: 0.02em;
    }
    .success span {
      font-size: 13px;
      color: rgba(210,203,254,0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      .watermark span { animation: none; opacity: 0.06; }
      .inner { animation: none; }
    }
  </style>
</head>

    <h1>Something is coming.</h1>
    <p class="sub">No spam. No explanation. Not yet.</p>

    <div class="form-wrap" id="formWrap">
      <div class="form-group">
        <input type="text" id="name" placeholder="Your name" autocomplete="given-name" />
      </div>
      <div class="form-group">
        <input type="email" id="email" placeholder="Your email" autocomplete="email" />
      </div>
      <button class="cta-btn" id="ctaBtn" onclick="handleSubmit()">Notify me</button>
      <p class="error-msg" id="errorMsg">Something went wrong. Please try again.</p>
      <p class="disclaimer">No spam. No explanation. Not yet.</p>
    </div>

    <div class="success" id="success">
      <p>You're on the list.</p>
      <span>We'll reach out when the time is right.</span>
    </div>
  </div>

  <script>
    async function handleSubmit() {
      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();

      // Validate name and email presence + basic email format
      if (!name || !email || !email.includes('@')) {
        const form = document.getElementById('formWrap');
        form.style.animation = 'none';
        form.offsetHeight; // force reflow to restart animation
        form.style.animation = 'shake 0.35s ease';
        return;
      }

      const btn = document.getElementById('ctaBtn');
      btn.disabled = true;
      btn.textContent = '...';

      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.remove('show');

      try {
        const res = await fetch('https://get-brevo-key.jacobk.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email }),
        });

        if (res.ok) {
          // Success — hide form, show confirmation
          document.getElementById('formWrap').style.display = 'none';
          document.getElementById('success').classList.add('show');
        } else {
          // Non-200 response — re-enable button, show error
          btn.disabled = false;
          btn.textContent = 'Notify me';
          errorMsg.classList.add('show');
        }
      } catch {
        // Network / fetch error — re-enable button, show error
        btn.disabled = false;
        btn.textContent = 'Notify me';
        errorMsg.classList.add('show');
      }
    }

    // Enter key submits form
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleSubmit();
      });
    });
  </script>
