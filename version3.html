<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASii — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    :root {
      --navy:    #030335;
      --indigo:  #1E38D1;
      --flower:  #5497F3;
      --cyan:    #D5F2FD;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }
    @keyframes fadeInC {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body {
      background: var(--navy);
      position: relative;
      overflow: hidden;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Dot-grid texture */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(84,151,243,0.18) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    /* Vignette */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, var(--navy) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 48px 24px;
      width: 100%;
      max-width: 560px;
      animation: fadeInC 0.9s cubic-bezier(.16,1,.3,1) both;
    }

    .logo-wrap {
      width: clamp(130px, 20vw, 180px);
      margin-bottom: 40px;
      opacity: 0.9;
    }
    .logo-wrap img { width: 100%; height: auto; display: block; }

    h1 {
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 300;
      color: var(--cyan);
      letter-spacing: -0.01em;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    p.sub {
      font-size: clamp(13px, 1.8vw, 15px);
      font-weight: 300;
      color: rgba(213,242,253,0.45);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .form-wrap { width: 100%; max-width: 400px; }
    .form-group { margin-bottom: 14px; }
    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(84,151,243,0.2);
      color: var(--cyan);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 300;
      padding: 14px 18px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }
    input::placeholder { color: rgba(213,242,253,0.22); }
    input:focus {
      border-color: var(--flower);
      background: rgba(84,151,243,0.07);
    }

    .cta-btn {
      margin-top: 24px;
      width: 100%;
      background: var(--indigo);
      color: #fff;
      border: none;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 17px 32px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s, transform 0.15s;
    }
    .cta-btn:hover:not(:disabled) { background: #2544e8; transform: translateY(-1px); }
    .cta-btn:active { transform: translateY(0); }
    .cta-btn:disabled { opacity: 0.5; cursor: default; }

    .disclaimer {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(213,242,253,0.22);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .error-msg {
      margin-top: 14px;
      font-size: 13px;
      color: rgba(255,140,140,0.85);
      letter-spacing: 0.03em;
      display: none;
    }
    .error-msg.show { display: block; }

    .success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .success.show { display: flex; }
    .success p {
      font-size: clamp(20px, 3.5vw, 28px);
      font-weight: 300;
      color: var(--cyan);
      letter-spacing: -0.01em;
    }
    .success span {
      font-size: 12px;
      color: rgba(213,242,253,0.3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      .inner { animation: none; }
    }
  </style>
</head>

    <h1>Be first to know.</h1>
    <p class="sub">No noise. Just the signal when it matters.</p>

    <div class="form-wrap" id="formWrap">
      <div class="form-group">
        <input type="text" id="name" placeholder="Your name" autocomplete="given-name" />
      </div>
      <div class="form-group">
        <input type="email" id="email" placeholder="Your email" autocomplete="email" />
      </div>
      <button class="cta-btn" id="ctaBtn" onclick="handleSubmit()">Get early access</button>
      <p class="error-msg" id="errorMsg">Something went wrong. Please try again.</p>
      <p class="disclaimer">No noise. Just the signal when it matters.</p>
    </div>

    <div class="success" id="success">
      <p>Signal received.</p>
      <span>You'll hear from us when it counts.</span>
    </div>
  </div>

  <script>
    async function handleSubmit() {
      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();

      // Validate name and email presence + basic email format
      if (!name || !email || !email.includes('@')) {
        const form = document.getElementById('formWrap');
        form.style.animation = 'none';
        form.offsetHeight; // force reflow to restart animation
        form.style.animation = 'shake 0.35s ease';
        return;
      }

      const btn = document.getElementById('ctaBtn');
      btn.disabled = true;
      btn.textContent = '...';

      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.remove('show');

      try {
        const res = await fetch('https://get-brevo-key.jacobk.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email }),
        });

        if (res.ok) {
          // Success — hide form, show confirmation
          document.getElementById('formWrap').style.display = 'none';
          document.getElementById('success').classList.add('show');
        } else {
          // Non-200 response — re-enable button, show error
          btn.disabled = false;
          btn.textContent = 'Get early access';
          errorMsg.classList.add('show');
        }
      } catch {
        // Network / fetch error — re-enable button, show error
        btn.disabled = false;
        btn.textContent = 'Get early access';
        errorMsg.classList.add('show');
      }
    }

    // Enter key submits form
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleSubmit();
      });
    });
  </script>
</body>
